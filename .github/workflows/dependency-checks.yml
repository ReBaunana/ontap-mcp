name: Dependency security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '35 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        module: ['.', integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the shared Go version
        id: go
        run: |
          version=$(sed -n 's/^GO_VERSION=//p' .go.env)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: Check reachable vulnerabilities without live ONTAP access
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
